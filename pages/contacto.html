    <main class="flex-grow-1">
      <section class="container my-5">
        <section class="row">
          <section class="col-md-6 ubicacion">
            <h2>Nuestra Ubicación</h2>
            <iframe class="mapa"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.106067949493!2d-65.20974192526461!3d-26.836578490025683!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses!2sar!4v1785276531833!5m2!1ses!2sar"

              height="450"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </section>
          <section class="col-md-6 formulario">
            <h2>Contactanos</h2>
            <form class="border border-black p-3">
              <div class="mb-3">
                <label for="InputNombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="InputNombre"
                  aria-describedby="emailHelp"
                />
              </div>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="exampleInputEmail1"
                  aria-describedby="emailHelp"
                />
                <div id="emailHelp" class="form-text">
                  No compartiremos esta informacion con nadie.
                </div>
              </div>
              <div class="mb-3">
                <label for="InputAsunto" class="form-label">Asunto</label>
                <input
                  type="text"
                  class="form-control"
                  id="InputAsunto"
                  aria-describedby="emailHelp"
                />
              </div>
              <div class="mb-3">
                <label for="InputMensaje" class="form-label">Mensaje</label>
                <textarea
                  type="text"
                  class="form-control"
                  id="InputMensaje"
                  aria-describedby="emailHelp"
                >
                </textarea>
              </div>
              <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
          </section>
        </section>
      </section>
    </main>
